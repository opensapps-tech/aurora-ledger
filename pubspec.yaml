name: aurora_ledger
description: >
  A fully offline, privacy-first expense sharing system.
  Zero infrastructure. Optical QR sync. Cryptographic identity.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Navigation ---
  go_router: ^13.2.0

  # --- Local database (drift + SQLCipher) ---
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.20

  # --- Cryptography (libsodium) ---
  # flutter_sodium (libsodium FFI bindings)
  # Replace with exact package name once confirmed for your flutter version
  sodium_libs: ">=3.0.0 <4.0.0"
  sodium: ">=3.0.0 <4.0.0"

  # --- Secure key storage ---
  flutter_secure_storage: ^9.0.0

  # --- QR scanning (MLKit + Vision on-device) ---
  mobile_scanner: ^5.2.3

  # --- QR generation ---
  qr_flutter: ^4.1.0

  # --- Serialization ---
  messagepack: ">=0.2.0 <0.3.0"

  # --- Compression (zstd via FFI) ---
  archive: ^3.6.1          # fallback gzip; replace with flutter_zstd when stable

  # --- Data classes / freezed ---
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # --- File system & paths ---
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Notifications (local, offline replica nudge) ---
  flutter_local_notifications: ^17.2.2

  # --- Misc UI ---
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code generation ---
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: 2.3.11

  # --- Testing ---
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true  # enables l10n generation

  assets:
    - assets/images/
    - assets/zstd_dictionary/

  fonts: []  # add custom fonts here when finalized
